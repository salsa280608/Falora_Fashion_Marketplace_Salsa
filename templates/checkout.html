{% extends 'base.html' %}{% block title %}Checkout — Falora{% endblock %}{% block content %}<section class="page-hero compact"><span class="eyebrow">05 — CHECKOUT</span><h1>Make it <em>yours.</em></h1></section><section class="section checkout-layout"><form id="checkout-form" class="checkout-form"><div class="form-section"><span class="step">01</span><div><h3>Contact</h3><label>Full name<input name="customer_name" required></label><label>Email<input name="email" type="email" required></label></div></div><div class="form-section"><span class="step">02</span><div><h3>Delivery</h3><label>Address<input name="address" required placeholder="Street, building, unit"></label><div class="two-col"><label>City<input name="city" required></label><label>Postal code<input name="postal_code" required></label></div></div></div><div class="form-section"><span class="step">03</span><div><h3>Payment</h3><div class="payment-grid"><label class="payment-option"><input type="radio" name="payment" value="Card" checked><i class="ri-bank-card-line"></i><span>Card</span></label><label class="payment-option"><input type="radio" name="payment" value="Bank Transfer"><i class="ri-building-4-line"></i><span>Bank transfer</span></label><label class="payment-option"><input type="radio" name="payment" value="E-Wallet"><i class="ri-wallet-3-line"></i><span>E-wallet</span></label></div><div class="fake-card"><span>FALORA PAY</span><strong>•••• •••• •••• 4242</strong><small>DEMO PAYMENT UI</small></div></div></div><button class="btn primary full" type="submit">Place order <i class="ri-arrow-right-up-line"></i></button><div id="checkout-message" class="form-message"></div></form><aside class="summary-card sticky"><span class="eyebrow">YOUR BAG</span><div id="checkout-summary"></div></aside></section>{% endblock %}
